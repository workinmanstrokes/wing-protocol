name: Deploy PWA to GitHub Pages

# Manual only: nothing goes live until you run this from the Actions tab.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installable PWA (served from /<repo>/)
        env:
          PWA_BASE: /${{ github.event.repository.name }}/
        run: npm run build:pwa

      - name: Disable Jekyll
        run: touch dist/client/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
