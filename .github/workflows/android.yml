name: Android build

on:
  workflow_dispatch:
  push:
    branches: [android-wrapper]
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package*.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web (static SPA) and sync Capacitor
        run: |
          BUILD_TARGET=capacitor npx vite build
          npx cap sync android

      - name: Debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK to rolling <branch>-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')-latest"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/WingProtocol-debug.apk"
          notes="Latest build of $BRANCH from $SHA (run $GITHUB_RUN_ID)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" --target "$SHA" --title "$BRANCH (latest build)" --notes "$notes" --prerelease
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/WingProtocol-debug.apk" --clobber

      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KSP" "$KA" "$KP" > android/keystore.properties

      - name: Release AAB (signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: WingProtocol-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 2

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload.jks android/keystore.properties
