<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#09090b;overflow:hidden}
  #stage{width:1200px;height:630px;position:relative;background:#09090b;font-family:Arial,Helvetica,sans-serif}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1200" height="630"></canvas></div>
<script>
const ctx = document.getElementById('c').getContext('2d');
const W = 1200, H = 630;

// ---- background ----
const bgGrad = ctx.createRadialGradient(W*0.32, H*0.42, 40, W*0.32, H*0.42, 900);
bgGrad.addColorStop(0, '#131318');
bgGrad.addColorStop(1, '#09090b');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

// grid (matches in-game battlefield grid)
ctx.strokeStyle = 'rgba(236,236,232,0.05)';
ctx.lineWidth = 1;
const CELL = 48;
for (let x = -((Date.now()%CELL)); x < W; x += CELL) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
for (let y = 0; y < H; y += CELL) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

// vignette
const vg = ctx.createRadialGradient(W*0.5,H*0.5,200,W*0.5,H*0.5,780);
vg.addColorStop(0,'rgba(0,0,0,0)');
vg.addColorStop(1,'rgba(0,0,0,0.55)');
ctx.fillStyle = vg;
ctx.fillRect(0,0,W,H);

// ---- faint enemy silhouettes (right side, distant horde) ----
function enemyBlip(x,y,s,c){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(-10,-8); ctx.lineTo(10,-4); ctx.lineTo(10,4); ctx.lineTo(-10,8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
const enemySpots = [[930,120,0.9],[1010,200,1.3],[880,260,0.7],[1040,340,1.1],[960,420,0.8],[1080,470,1.0],[900,500,0.6],[1000,90,0.6]];
for (const [x,y,s] of enemySpots) enemyBlip(x,y,s,'rgba(196,92,74,0.35)');

// xp / pickup dots scattered
function dot(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
const dots = [[860,180,4,'rgba(122,163,184,0.55)'],[1060,150,3,'rgba(122,163,184,0.4)'],[940,350,3,'rgba(212,196,160,0.45)'],[1000,460,4,'rgba(122,163,184,0.5)'],[870,420,3,'rgba(122,163,184,0.35)']];
for (const [x,y,r,c] of dots) dot(x,y,r,c);

// ---- hero mech: Aether Wing, large, left-center ----
function roundRect(x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function plate(x,y,w,h,fill,stroke,r){
  roundRect(x,y,w,h,r||2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.6; ctx.stroke();
}
function poly(pts,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.4; ctx.stroke(); }
}

ctx.save();
ctx.translate(272, 265);
ctx.rotate(-0.32);
ctx.scale(5.8, 5.8);
// glow behind the mech
ctx.save();
ctx.shadowColor = 'rgba(94,200,232,0.55)';
ctx.shadowBlur = 14;
const w='#e8eef2', a='#5ec8e8', d='#2a3340';
poly([[-18,-22],[8,-16],[8,16],[-18,22]], '#c5d0dc', d);
poly([[-18,-22],[-6,-28],[4,-18],[4,-8]], w, d);
poly([[-18,22],[-6,28],[4,18],[4,8]], w, d);
plate(-10,-8,22,16,w,d,3);
plate(8,-4,18,8,'#dfe7ee',d,2);
ctx.fillStyle = a;
ctx.fillRect(24,-2.5,14,5);
ctx.fillRect(24,-6.5,10,2);
ctx.fillRect(24,4.5,10,2);
plate(-4,-5,10,10,'#1c2833',d,2);
ctx.fillStyle = a;
ctx.beginPath(); ctx.arc(1,0,2.4,0,Math.PI*2); ctx.fill();
ctx.restore();
// engine trail
const trail = ctx.createLinearGradient(-42,0,-18,0);
trail.addColorStop(0,'rgba(94,200,232,0)');
trail.addColorStop(1,'rgba(94,200,232,0.85)');
ctx.fillStyle = trail;
ctx.beginPath();
ctx.moveTo(-42,-3); ctx.lineTo(-18,-6); ctx.lineTo(-18,6); ctx.lineTo(-42,3);
ctx.closePath(); ctx.fill();
ctx.restore();

// ---- HUD chips (top-left, echoes in-game bar) ----
ctx.font = '600 15px Arial';
ctx.textBaseline = 'middle';
function chip(x,y,w,label,value,accent){
  plate(x,y,w,34,'rgba(27,27,34,0.85)','rgba(236,236,232,0.14)',8);
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.arc(x+16,y+17,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ecece8';
  ctx.font = '700 15px Arial';
  ctx.fillText(value, x+28, y+18);
  ctx.font = '600 10px Arial';
  ctx.fillStyle = '#8b8b86';
  ctx.fillText(label, x+28, y+18+13);
}
chip(64, 56, 128, 'CREDITS', '520', '#c5cdd6');
chip(206, 56, 108, 'KEYS', '3', '#d4c4a0');

// ---- title lockup, centered lower-middle ----
ctx.textAlign = 'left';
ctx.save();
ctx.font = '600 18px Arial';
ctx.fillStyle = '#5ec8e8';
ctx.letterSpacing = '9px';
ctx.fillText('SORTIE PROTOCOL', 70, 442);
ctx.restore();

ctx.save();
ctx.font = '800 80px Arial';
ctx.fillStyle = '#ecece8';
ctx.letterSpacing = '1px';
ctx.fillText('WING PROTOCOL', 66, 518);
ctx.restore();

ctx.save();
ctx.font = '600 20px Arial';
ctx.fillStyle = '#8b8b86';
ctx.letterSpacing = '2px';
ctx.fillText('Survive the mech horde. Extract with the loot.', 70, 556);
ctx.restore();

// frame edge
ctx.strokeStyle = 'rgba(236,236,232,0.08)';
ctx.lineWidth = 2;
ctx.strokeRect(1,1,W-2,H-2);
</script>
</body>
</html>
