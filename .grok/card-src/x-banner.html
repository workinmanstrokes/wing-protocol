<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#09090b;overflow:hidden}
  #stage{width:1200px;height:264px;position:relative;background:#09090b;font-family:Arial,Helvetica,sans-serif}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1200" height="264"></canvas></div>
<script>
const ctx = document.getElementById('c').getContext('2d');
const W = 1200, H = 264;

const bgGrad = ctx.createLinearGradient(0,0,W,0);
bgGrad.addColorStop(0, '#131318');
bgGrad.addColorStop(1, '#09090b');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

ctx.strokeStyle = 'rgba(236,236,232,0.05)';
ctx.lineWidth = 1;
const CELL = 40;
for (let x = 0; x < W; x += CELL) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
for (let y = 0; y < H; y += CELL) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

function enemyBlip(x,y,s,c){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(-10,-8); ctx.lineTo(10,-4); ctx.lineTo(10,4); ctx.lineTo(-10,8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
for (const [x,y,s] of [[1080,60,1.1],[1140,110,0.8],[1000,150,0.9],[1150,190,1.0],[1050,210,0.7]]) enemyBlip(x,y,s,'rgba(196,92,74,0.4)');
function dot(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
for (const [x,y,r,c] of [[970,70,3,'rgba(122,163,184,0.5)'],[1110,150,3,'rgba(122,163,184,0.4)'],[1020,40,2.5,'rgba(212,196,160,0.4)']]) dot(x,y,r,c);

function roundRect(x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function plate(x,y,w,h,fill,stroke,r){
  roundRect(x,y,w,h,r||2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.6; ctx.stroke();
}
function poly(pts,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.4; ctx.stroke(); }
}

// mech sits right side, extending into the overlay-safe right/bottom zone
ctx.save();
ctx.translate(940, 205);
ctx.rotate(-0.32);
ctx.scale(5.2, 5.2);
ctx.save();
ctx.shadowColor = 'rgba(94,200,232,0.55)';
ctx.shadowBlur = 12;
const w='#e8eef2', a='#5ec8e8', d='#2a3340';
poly([[-18,-22],[8,-16],[8,16],[-18,22]], '#c5d0dc', d);
poly([[-18,-22],[-6,-28],[4,-18],[4,-8]], w, d);
poly([[-18,22],[-6,28],[4,18],[4,8]], w, d);
plate(-10,-8,22,16,w,d,3);
plate(8,-4,18,8,'#dfe7ee',d,2);
ctx.fillStyle = a;
ctx.fillRect(24,-2.5,14,5);
ctx.fillRect(24,-6.5,10,2);
ctx.fillRect(24,4.5,10,2);
plate(-4,-5,10,10,'#1c2833',d,2);
ctx.fillStyle = a;
ctx.beginPath(); ctx.arc(1,0,2.4,0,Math.PI*2); ctx.fill();
ctx.restore();
const trail = ctx.createLinearGradient(-40,0,-16,0);
trail.addColorStop(0,'rgba(94,200,232,0)');
trail.addColorStop(1,'rgba(94,200,232,0.85)');
ctx.fillStyle = trail;
ctx.beginPath();
ctx.moveTo(-40,-3); ctx.lineTo(-16,-6); ctx.lineTo(-16,6); ctx.lineTo(-40,3);
ctx.closePath(); ctx.fill();
ctx.restore();

// lockup: left half, top 80%, raised above midline
ctx.save();
ctx.font = '600 15px Arial';
ctx.fillStyle = '#5ec8e8';
ctx.letterSpacing = '8px';
ctx.fillText('SORTIE PROTOCOL', 56, 84);
ctx.restore();

ctx.save();
ctx.font = '800 54px Arial';
ctx.fillStyle = '#ecece8';
ctx.letterSpacing = '1px';
ctx.fillText('WING PROTOCOL', 52, 140);
ctx.restore();

ctx.save();
ctx.font = '600 17px Arial';
ctx.fillStyle = '#8b8b86';
ctx.letterSpacing = '1.5px';
ctx.fillText('Survive the mech horde. Extract with the loot.', 56, 172);
ctx.restore();

ctx.strokeStyle = 'rgba(236,236,232,0.08)';
ctx.lineWidth = 2;
ctx.strokeRect(1,1,W-2,H-2);
</script>
</body>
</html>
